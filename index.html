<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Medieval Kingdom — Build, Conquer, Survive</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0a; overflow: hidden; }
    #canvas-container { width: 100vw; height: 100vh; }
    canvas { display: block; }
    #ui-root { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
    #loading-screen {
      position: fixed; inset: 0; background: #0a0806;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: 'Georgia', serif; color: #c8a96e; z-index: 9999;
    }
    #loading-screen h1 { font-size: 48px; margin-bottom: 16px; text-shadow: 0 0 20px #8b6914; }
    #loading-screen p { font-size: 16px; opacity: 0.7; margin-bottom: 32px; }
    #loading-bar-wrap { width: 300px; height: 6px; background: #2a1f0a; border-radius: 3px; }
    #loading-bar { height: 100%; background: #c8a96e; border-radius: 3px; width: 0%; transition: width 0.3s; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <h1>⚔ Medieval Kingdom</h1>
    <p>Generating world…</p>
    <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  </div>
  <div id="canvas-container"></div>
  <div id="ui-root"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
